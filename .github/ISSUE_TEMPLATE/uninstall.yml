name: 移除的原因
description: 移除了 ZhuyinType，告訴我們原因
title: "[移除] "
body:
  - type: markdown
    attributes:
      value: |
        這裡的內容是公開的。請不要貼上私人的文字、姓名、電話、地址、帳號或密碼；只寫你願意公開的部分。
  - type: input
    id: reason
    attributes:
      label: 原因
      placeholder: 例如 轉換或選字不準、缺少需要的功能、改用其他輸入法
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: 說明（選填）
      description: 例如遇到的情況，或有什麼改變時會想再試試看。
  - type: input
    id: version
    attributes:
      label: ZhuyinType 版本
      description: 「設定 › 關於」最上方；從 App 開啟這一頁時已經填好。
      placeholder: 例如 0.7.6
    validations:
      required: false
  - type: input
    id: system
    attributes:
      label: 系統
      description: 作業系統與版本；Linux 另外寫桌面環境與 X11 或 Wayland。
      placeholder: 例如 macOS 26.1、Windows 11 24H2、Ubuntu 25.04（GNOME，Wayland）
    validations:
      required: false
