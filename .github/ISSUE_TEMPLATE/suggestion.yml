name: 建議
description: 希望增加的功能，或想改變的做法
title: "[建議] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        這裡的內容是公開的。請不要貼上私人的文字、姓名、電話、地址、帳號或密碼；例句請改成沒有私人內容的句子。
  - type: textarea
    id: idea
    attributes:
      label: 建議的內容
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 會用在什麼情況（選填）
      description: 現在怎麼做、哪裡不方便。其他軟體有類似的功能時，可以寫出名稱。
  - type: input
    id: version
    attributes:
      label: ZhuyinType 版本
      description: 「設定 › 關於」最上方；從 App 開啟這一頁時已經填好。
      placeholder: 例如 0.7.6
    validations:
      required: false
  - type: input
    id: system
    attributes:
      label: 系統
      description: 作業系統與版本；Linux 另外寫桌面環境與 X11 或 Wayland。
      placeholder: 例如 macOS 26.1、Windows 11 24H2、Ubuntu 25.04（GNOME，Wayland）
    validations:
      required: false
