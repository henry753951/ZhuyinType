# Every push and pull request: no private hosts, keys or addresses in tracked files.  The Python tools, the engine and
# the macOS app have their own workflows (ml.yml, engine.yml, macos.yml), each started by changes in its directories.
# Evaluations do not run here: they run on the GPU host (benchmark.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: tools/check-public.sh

