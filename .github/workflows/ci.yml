# Every push and pull request: privacy check, the Python tools (lint, types, tests), the engine on Linux
# (portability, behaviour checks) and the macOS client.  Jobs run in parallel; SwiftPM builds, ONNX Runtime, uv and
# data assets are cached by content hash, so a warm run takes a few minutes.  Every step goes through tools/zt.
# Evaluations do not run here: they run on the GPU host (benchmark.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: tools/check-public.sh

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: tools/zt check lint
      - run: tools/zt check types
      - run: tools/zt check python

  engine-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.4-noble
    env:
      ONNXRUNTIME_ROOT: /opt/onnxruntime
      ORT_VERSION: 1.24.4
      ZHUYIN_CHECKS_TIMING: warn
    steps:
      - name: Tools in the Swift image
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl git ca-certificates >/dev/null
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: ONNX Runtime
        uses: actions/cache@v6
        with:
          path: /opt/onnxruntime
          key: ort-linux-x64-${{ env.ORT_VERSION }}
      - run: |
          if [ ! -d /opt/onnxruntime/lib ]; then
            curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-linux-x64-$ORT_VERSION.tgz" | tar -xz -C /opt
            mv "/opt/onnxruntime-linux-x64-$ORT_VERSION" /opt/onnxruntime
          fi
      - name: Data assets
        uses: actions/cache@v6
        with:
          path: .cache/assets
          key: assets-lexicon-lm-${{ hashFiles('nlp/data/assets.json') }}
      - run: tools/zt setup
      - run: tools/zt data fetch engine
      - name: SwiftPM build cache
        uses: actions/cache@v6
        with:
          path: .build
          key: engine-linux-${{ hashFiles('nlp/engine/Package.swift', 'nlp/engine/Sources/**') }}
          restore-keys: engine-linux-
      - run: tools/zt build cli
      - run: tools/zt check engine

  macos:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      ZHUYIN_CHECKS_TIMING: warn
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Data assets
        uses: actions/cache@v6
        with:
          path: .cache/assets
          key: assets-app-${{ hashFiles('nlp/data/assets.json') }}
      - run: tools/zt setup
      - run: tools/zt data fetch
      - name: SwiftPM build cache
        uses: actions/cache@v6
        with:
          path: .build
          key: macos-${{ hashFiles('nlp/engine/Package.swift', 'clients/macos/Package.resolved', 'nlp/engine/Sources/**', 'clients/macos/Sources/**') }}
          restore-keys: macos-
      - run: tools/zt build cli
      - run: tools/zt check engine
      - run: tools/zt build app
      - name: Self-test and packaging checks
        run: tools/zt check app
