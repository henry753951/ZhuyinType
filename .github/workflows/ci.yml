# Every push and pull request: privacy check, the engine on Linux (portability, behaviour checks) and the macOS
# client.  Jobs run in parallel; SwiftPM builds, ONNX Runtime and data assets are cached by content hash, so a warm
# run takes a few minutes.  Evaluations do not run here: they run on the GPU host (benchmark.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: tools/check-public.sh

  engine-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.4-noble
    env:
      ONNXRUNTIME_ROOT: /opt/onnxruntime
      ORT_VERSION: 1.24.4
      ZHUYIN_CHECKS_TIMING: warn
    steps:
      - uses: actions/checkout@v5
      - name: ONNX Runtime
        uses: actions/cache@v4
        with:
          path: /opt/onnxruntime
          key: ort-linux-x64-${{ env.ORT_VERSION }}
      - run: |
          if [ ! -d /opt/onnxruntime/lib ]; then
            apt-get update -qq && apt-get install -y -qq curl >/dev/null
            curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-linux-x64-$ORT_VERSION.tgz" | tar -xz -C /opt
            mv "/opt/onnxruntime-linux-x64-$ORT_VERSION" /opt/onnxruntime
          fi
      - name: Data assets
        uses: actions/cache@v4
        with:
          path: .cache/assets
          key: assets-lexicon-lm-${{ hashFiles('nlp/data/assets.json') }}
      - run: python3 nlp/data/assets.py fetch lexicon lm
      - name: SwiftPM build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: engine-linux-${{ hashFiles('nlp/engine/Package.swift', 'nlp/engine/Sources/**') }}
          restore-keys: engine-linux-
      - run: swift build -c release --package-path nlp/engine --scratch-path .build
      - run: swift run -c release --package-path nlp/engine --scratch-path .build ZhuyinCoreChecks

  macos:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      ZHUYIN_CHECKS_TIMING: warn
    steps:
      - uses: actions/checkout@v5
      - name: Data assets
        uses: actions/cache@v4
        with:
          path: .cache/assets
          key: assets-app-${{ hashFiles('nlp/data/assets.json') }}
      - run: python3 nlp/data/assets.py fetch
      - name: SwiftPM build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: macos-${{ hashFiles('nlp/engine/Package.swift', 'clients/macos/Package.resolved', 'nlp/engine/Sources/**', 'clients/macos/Sources/**') }}
          restore-keys: macos-
      - run: swift build -c release --package-path nlp/engine --scratch-path .build
      - run: swift run -c release --package-path nlp/engine --scratch-path .build ZhuyinCoreChecks
      - name: App
        run: SWIFT_SCRATCH_PATH=.build clients/macos/scripts/build-app.sh release
      - run: dist/ZhuyinType.app/Contents/MacOS/ZhuyinType --self-test --lexicon data/build/lexicon.tsv
      - run: swift clients/macos/scripts/check-packaging.swift dist/ZhuyinType.app
