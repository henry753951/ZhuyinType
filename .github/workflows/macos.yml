# The macOS input method: the engine's tests on macOS, the app build (with the Rust engine), its self-test and
# packaging check.  On main the checked app is kept as an artifact: release.yml signs and publishes that app rather
# than building it again.
name: macOS

on:
  push:
    branches: [main]
    paths: ["platforms/macos/**", "engine/**", "resources/**", "ml/src/**", "ml/pyproject.toml", "tools/**", "docs/releases/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["platforms/macos/**", "engine/**", "resources/**", "ml/src/**", "ml/pyproject.toml", "tools/**", "docs/releases/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

# A new push to a pull request replaces its older run; main's runs all finish, since a release reuses each commit's.
concurrency:
  group: macos-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      ZHUYIN_CHECKS_TIMING: warn
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Data assets
        uses: actions/cache@v6
        with:
          path: .cache/assets
          key: assets-app-${{ hashFiles('resources/assets.json') }}
      - run: tools/zt setup
      - run: tools/zt data fetch
      - name: Build caches (SwiftPM, cargo)
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.cargo/registry
            engine/target
          key: macos-${{ hashFiles('engine/Cargo.lock', 'engine/rust-toolchain.toml', 'platforms/macos/Package.resolved', 'platforms/macos/Sources/**') }}
          restore-keys: macos-
      - run: tools/zt build cli
      - run: tools/zt check engine
      - run: tools/zt build app
      - name: Self-test and packaging checks
        run: tools/zt check app
      - name: Keep the app for the release
        if: github.event_name == 'push'
        run: ditto -c -k --sequesterRsrc --keepParent dist/ZhuyinType.app dist/ZhuyinType.app.zip
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: zhuyintype-macos-app
          path: dist/ZhuyinType.app.zip
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
