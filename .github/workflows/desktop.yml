# ZhuyinType for Linux and Windows on every change to platforms/desktop or platforms/linux: the .deb and .rpm (built
# in the Debian 13 image by scripts/build.sh, then installed and removed in clean containers) and the Windows
# installer (cross-compiled with cargo-xwin, NSIS), kept as artifacts.  release.yml publishes the artifacts of the
# tagged commit's run on main, and calls this workflow only when that run is missing.
name: Desktop

on:
  push:
    branches: [main]
    paths:
      - "platforms/desktop/**"
      - "platforms/linux/**"
      - "engine/crates/zhuyin-core/**"
      - "resources/assets.json"
      - "docs/releases/**"
      - "tools/release_notes.py"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "platforms/desktop/**"
      - "platforms/linux/**"
      - "engine/crates/zhuyin-core/**"
      - "resources/assets.json"
      - "docs/releases/**"
      - "tools/release_notes.py"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  workflow_call:

# A new push to a pull request replaces its older run; main's runs all finish, since a release reuses each commit's
# artifacts (release.yml).
concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ZT_TOOLCHAINS: ${{ github.workspace }}/.cache/toolchains
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick
      - name: Data assets
        uses: actions/cache@v6
        with:
          path: .cache/assets
          key: assets-desktop-${{ hashFiles('resources/assets.json') }}
      - name: Cargo cache of the builder image
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            .cache/toolchains
            platforms/desktop/target/builder-debian13
          key: desktop-linux-${{ hashFiles('platforms/desktop/Cargo.lock', 'platforms/desktop/rust-toolchain.toml', 'platforms/desktop/packaging/linux/Dockerfile') }}
          restore-keys: desktop-linux-
      - name: Packages
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          platforms/desktop/scripts/build.sh linux --package
      - name: Install and remove in clean containers
        run: platforms/desktop/packaging/linux/verify.sh dist/desktop
      - run: platforms/desktop/packaging/linux/verify.sh dist/desktop --lint
      - uses: actions/upload-artifact@v6
        with:
          name: zhuyintype-linux
          path: |
            dist/desktop/*.deb
            dist/desktop/*.rpm
            dist/desktop/SHA256SUMS-linux
          if-no-files-found: error

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ZT_TOOLCHAINS: ${{ github.workspace }}/.cache/toolchains
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: |
          if [ -f platforms/desktop/packaging/windows/build.sh ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::platforms/desktop/packaging/windows/build.sh does not exist yet; no Windows installer"; fi
      - if: steps.script.outputs.present == 'true'
        uses: astral-sh/setup-uv@v7
      - if: steps.script.outputs.present == 'true'
        name: Cross toolchain (clang-cl, lld, NSIS, cargo-xwin)
        working-directory: platforms/desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm nsis imagemagick
          rustup show active-toolchain || rustup toolchain install
          # Ubuntu ships no clang-cl; clang called by that name runs in cl mode.  The linker is the toolchain's own
          # rust-lld called as lld-link: Ubuntu's lld 18 rejects the EXPORTAS exports rustc writes for the 32-bit DLL.
          # llvm-rc comes from the llvm package (/usr/bin).
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(readlink -f "$(command -v clang)")" "$HOME/.local/bin/clang-cl"
          ln -sf "$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" "$HOME/.local/bin/lld-link"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # cargo-xwin, pinned and kept between runs (building it takes over a minute).
      - if: steps.script.outputs.present == 'true'
        id: xwin
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-xwin
          key: cargo-xwin-0.23.1-${{ runner.os }}
      - if: steps.script.outputs.present == 'true' && steps.xwin.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-xwin --version 0.23.1
      - if: steps.script.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/cargo-xwin
            platforms/desktop/target
          key: desktop-windows-${{ hashFiles('platforms/desktop/Cargo.lock', 'platforms/desktop/rust-toolchain.toml') }}
          restore-keys: desktop-windows-
      # The data assets and ONNX Runtime archive the installer bundles.  Each has a cache of its own, keyed on the file
      # that pins it, so a build never depends on GitHub's or NuGet's downloads being up once the cache holds them
      # (0.7.0's first release run failed when github.com/microsoft/onnxruntime returned 404).
      - if: steps.script.outputs.present == 'true'
        name: Data assets
        uses: actions/cache@v6
        with:
          path: .cache/assets
          key: assets-desktop-windows-${{ hashFiles('resources/assets.json') }}
      - if: steps.script.outputs.present == 'true'
        name: ONNX Runtime
        uses: actions/cache@v6
        with:
          path: .cache/toolchains
          key: desktop-windows-toolchains-${{ hashFiles('platforms/desktop/packaging/neural.sh') }}
          restore-keys: desktop-windows-toolchains-
      - if: steps.script.outputs.present == 'true'
        name: Installer
        run: platforms/desktop/scripts/build.sh windows --package
      - if: steps.script.outputs.present == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: zhuyintype-windows
          path: dist/desktop/*.exe
          if-no-files-found: error
