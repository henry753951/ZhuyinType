# A v* tag signs and publishes a release for every platform, then updates the Sparkle appcast and the Windows/Linux
# update feed (desktop-update.json) on main so installed copies update themselves.  Gate: the tag matches Info.plist
# and platforms/desktop/Cargo.toml, and docs/releases/<tag>.md exists (notes and benchmark summary).
#
# Built once: the tagged commit's own push runs on main (desktop.yml, macos.yml) already built and checked the Windows
# installer, the Linux packages and the macOS app, so this workflow waits for those runs and takes their artifacts
# instead of building again.  It fails when one of them failed (rerun its failed jobs, then this one).  Only when a run
# or its artifacts are missing (an old tag rebuilt by rebuild-releases.yml, a commit the path filters skipped) does it
# build that platform here, as before.  tools/release.sh does the whole release with one command.  The release is
# published only when all three platforms are there, so a release never lacks one of them.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: everything but publishing, for the version in Info.plist (the result is an artifact)'
        type: boolean
        default: false
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  ci:
    name: Main CI of this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      desktop: ${{ steps.find.outputs.desktop }}
      macos: ${{ steps.find.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools
      - id: find
        run: |
          desktop=$(tools/ci-run.sh desktop.yml "$GITHUB_SHA" zhuyintype-linux zhuyintype-windows)
          macos=$(tools/ci-run.sh macos.yml "$GITHUB_SHA" zhuyintype-macos-app)
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          from() { if [ -n "$1" ]; then echo "the artifacts of main's run $1"; else echo "built in this run"; fi; }
          {
            echo "- Windows and Linux: $(from "$desktop")"
            echo "- macOS: $(from "$macos")"
          } >> "$GITHUB_STEP_SUMMARY"

  desktop:
    needs: ci
    if: needs.ci.outputs.desktop == ''
    uses: ./.github/workflows/desktop.yml

  release:
    needs: [ci, desktop]
    if: ${{ !cancelled() && needs.ci.result == 'success' && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') }}
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      ZHUYIN_CHECKS_TIMING: warn
      TAG: ${{ github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gate
        id: version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" platforms/macos/Resources/Info.plist)
          if [ "$DRY_RUN" = true ]; then
            TAG=v$version
            echo "TAG=$TAG" >> "$GITHUB_ENV"
            echo "::notice::Dry run of $TAG from $GITHUB_REF_NAME: everything but publishing"
          fi
          [ "v$version" = "$TAG" ] || { echo "Tag $TAG does not match Info.plist $version"; exit 1; }
          desktop=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' platforms/desktop/Cargo.toml)
          [ "v$desktop" = "$TAG" ] || { echo "Tag $TAG does not match platforms/desktop/Cargo.toml $desktop"; exit 1; }
          [ -f "docs/releases/$TAG.md" ] || { echo "docs/releases/$TAG.md is missing"; exit 1; }
          tools/check-public.sh
          echo "latest=$(gh release view --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
      - name: Data assets
        uses: actions/cache@v6
        with:
          path: .cache/assets
          key: assets-app-${{ hashFiles('resources/assets.json') }}
      - run: tools/zt setup
      - run: tools/zt data fetch
      - name: Build caches (SwiftPM, cargo)
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.cargo/registry
            engine/target
          key: macos-${{ hashFiles('engine/Cargo.lock', 'engine/rust-toolchain.toml', 'platforms/macos/Package.resolved', 'platforms/macos/Sources/**') }}
          restore-keys: macos-
      - name: Sparkle tools
        uses: actions/cache@v6
        with:
          path: .tools
          key: sparkle-tools-${{ hashFiles('platforms/macos/scripts/sparkle-tools.sh') }}
      - name: The macOS app main CI built and checked
        if: needs.ci.outputs.macos != ''
        uses: actions/download-artifact@v7
        with:
          name: zhuyintype-macos-app
          path: dist
          run-id: ${{ needs.ci.outputs.macos }}
          github-token: ${{ github.token }}
      - name: Unpack the app
        if: needs.ci.outputs.macos != ''
        run: |
          ditto -x -k dist/ZhuyinType.app.zip dist && rm dist/ZhuyinType.app.zip
          built=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/ZhuyinType.app/Contents/Info.plist)
          [ "v$built" = "$TAG" ] || { echo "The app from main CI is $built, not $TAG"; exit 1; }
          codesign --verify --deep --strict dist/ZhuyinType.app
          echo "ZT_PREBUILT_APP=1" >> "$GITHUB_ENV"
      - name: Engine checks
        if: needs.ci.outputs.macos == ''
        run: tools/zt check engine
      - name: Build, package, sign the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          key=$(mktemp)
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key"
          SWIFT_SCRATCH_PATH=.build SPARKLE_ED_KEY_FILE="$key" platforms/macos/scripts/release.sh
          rm -f "$key"
      - name: Self-test and packaging checks
        if: needs.ci.outputs.macos == ''
        run: tools/zt check app
      - name: Speed, energy and memory on this Mac
        run: |
          tools/zt eval latency --data dist/ZhuyinType.app/Contents/Resources --json dist/release/metrics-mac.json
      - name: Windows installer and Linux packages from main CI
        if: needs.ci.outputs.desktop != ''
        uses: actions/download-artifact@v7
        with:
          pattern: zhuyintype-*
          merge-multiple: true
          path: dist/desktop
          run-id: ${{ needs.ci.outputs.desktop }}
          github-token: ${{ github.token }}
      - name: Windows installer and Linux packages built here
        if: needs.ci.outputs.desktop == ''
        uses: actions/download-artifact@v7
        with:
          pattern: zhuyintype-*
          merge-multiple: true
          path: dist/desktop
      - name: Stable download names
        # README links to releases/latest/download/<stable name>, which always points at the newest release.  The
        # versioned files stay beside them for anyone keeping several versions.
        run: |
          version=${TAG#v}
          pkg=$(ls dist/release/ZhuyinType-*.pkg | head -1)
          cp "$pkg" dist/release/ZhuyinType-macOS.pkg
          exe=dist/desktop/ZhuyinType-$version-windows-x64-setup.exe
          deb=dist/desktop/zhuyintype_${version}_amd64.deb
          rpm=dist/desktop/zhuyintype-$version.x86_64.rpm
          for file in "$exe" "$deb" "$rpm"; do [ -f "$file" ] || { echo "$file is missing"; ls -l dist/desktop; exit 1; }; done
          cp "$exe" "$deb" "$rpm" dist/release/
          cp "$exe" dist/release/ZhuyinType-Windows-x64-setup.exe
          cp "$deb" dist/release/ZhuyinType-Linux-amd64.deb
          cp "$rpm" dist/release/ZhuyinType-Linux-x86_64.rpm
          (cd dist/release && shasum -a 256 ZhuyinType-Windows-x64-setup.exe ZhuyinType-Linux-amd64.deb \
            ZhuyinType-Linux-x86_64.rpm "${exe##*/}" "${deb##*/}" "${rpm##*/}" > SHA256SUMS-desktop.txt)
      - name: Update feed for Windows and Linux
        # zt_core::update: the installed apps read desktop-update.json from main.  Each installer and the feed itself
        # are signed with the Sparkle key, whose public half the apps carry.
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          key=$(mktemp)
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key"
          tools=$(platforms/macos/scripts/sparkle-tools.sh)
          sign() { "$tools/sign_update" --ed-key-file "$key" "$1" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p'; }
          version=${TAG#v}
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          entry() {
            local signature
            signature=$(sign "dist/release/$1")
            [ -n "$signature" ] || { echo "no signature for $1"; exit 1; }
            printf '{"url":"%s/%s","length":%s,"signature":"%s"}' "$base" "$1" "$(stat -f%z "dist/release/$1")" "$signature"
          }
          windows=$(entry "ZhuyinType-$version-windows-x64-setup.exe")
          deb=$(entry "zhuyintype_${version}_amd64.deb")
          rpm=$(entry "zhuyintype-$version.x86_64.rpm")
          printf '{"version":"%s","notes":"https://github.com/%s/blob/main/docs/releases/%s.md","assets":{"windows-x64":%s,"linux-deb":%s,"linux-rpm":%s}}' \
            "$version" "$GITHUB_REPOSITORY" "$TAG" "$windows" "$deb" "$rpm" > dist/desktop-feed.json
          signature=$(sign dist/desktop-feed.json)
          [ -n "$signature" ] || { echo "no signature for the feed"; exit 1; }
          python3 -c 'import json, sys; print(json.dumps({"feed": open(sys.argv[1], encoding="utf-8").read(), "signature": sys.argv[2]}))' \
            dist/desktop-feed.json "$signature" > desktop-update.json
          rm -f "$key"
          cat desktop-update.json
      - name: Keep the dry run's result
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-dry-run
          path: |
            dist/release
            appcast.xml
            desktop-update.json
          retention-days: 7
      - name: Publish
        if: env.DRY_RUN != 'true'
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --clobber
            gh release edit "$TAG" --notes-file "docs/releases/$TAG.md"
          else
            gh release create "$TAG" --title "ZhuyinType ${TAG#v}" \
              --notes-file "docs/releases/$TAG.md" dist/release/*
          fi
      - name: Update the appcast on main
        if: env.DRY_RUN != 'true' && (github.event_name != 'workflow_dispatch' || steps.version.outputs.latest == env.TAG)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp appcast.xml /tmp/appcast.xml
          cp desktop-update.json /tmp/desktop-update.json
          git fetch origin main && git checkout main && git reset --hard origin/main
          cp /tmp/appcast.xml appcast.xml
          cp /tmp/desktop-update.json desktop-update.json
          git add appcast.xml desktop-update.json
          git diff --cached --quiet || git commit -m "Appcast and update feed for $TAG [skip ci]"
          git push origin main
      - name: Start ZhuyinBench on the GPU host
        if: github.event_name != 'workflow_dispatch'
        run: gh workflow run benchmark.yml -f version="$TAG" || echo "Benchmark not started"

  # The implicit success() of a job is false when any job before it was skipped (desktop, when main's CI built it),
  # so the condition is spelled out.
  verify:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && inputs.dry_run != true }}
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ github.ref_name }}
