# The engine on every change to engine/ or resources/: the Rust workspace (format, lint, docs, licences, tests), and
# zt's engine path on Linux (zhuyin-cli with ONNX Runtime, the engine's tests on the real data).
name: Engine

on:
  push:
    branches: [main]
    paths: ["engine/**", "resources/**", "ml/src/**", "ml/pyproject.toml", "tools/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "resources/**", "ml/src/**", "ml/pyproject.toml", "tools/**", ".github/workflows/engine.yml"]
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ONNXRUNTIME_ROOT: /opt/onnxruntime
      ORT_VERSION: 1.24.4
      ZHUYIN_CHECKS_TIMING: warn
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Toolchain from rust-toolchain.toml
        working-directory: engine
        run: rustup show active-toolchain || rustup toolchain install
      - name: ONNX Runtime
        uses: actions/cache@v6
        with:
          path: /opt/onnxruntime
          key: ort-linux-x64-${{ env.ORT_VERSION }}
      # Microsoft's release archive, or (as platforms/desktop/packaging/neural.sh does) the same build from NuGet's
      # Microsoft.ML.OnnxRuntime package laid out as the SDK (include/, lib/) when GitHub does not serve it.
      - run: |
          if [ ! -d /opt/onnxruntime/lib ]; then
            sudo mkdir -p /opt && sudo chown "$USER" /opt
            if curl -fsSL -o /tmp/ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-linux-x64-$ORT_VERSION.tgz"; then
              tar -xzf /tmp/ort.tgz -C /opt
              mv "/opt/onnxruntime-linux-x64-$ORT_VERSION" /opt/onnxruntime
            else
              echo "ONNX Runtime $ORT_VERSION from NuGet"
              curl -fsSL -o /tmp/ort.nupkg "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$ORT_VERSION/microsoft.ml.onnxruntime.$ORT_VERSION.nupkg"
              echo "4b978d5065b85e7004b6c6f60ca494bd978fbe6836cbf0a0b52d82b61ab99638  /tmp/ort.nupkg" | sha256sum -c -
              mkdir -p /tmp/ort-nuget /opt/onnxruntime/lib /opt/onnxruntime/include
              unzip -q /tmp/ort.nupkg 'build/native/include/*' 'runtimes/linux-x64/native/*' -d /tmp/ort-nuget
              cp /tmp/ort-nuget/build/native/include/* /opt/onnxruntime/include/
              cp /tmp/ort-nuget/runtimes/linux-x64/native/libonnxruntime.so "/opt/onnxruntime/lib/libonnxruntime.so.$ORT_VERSION"
              ln -s "libonnxruntime.so.$ORT_VERSION" /opt/onnxruntime/lib/libonnxruntime.so.1
              ln -s libonnxruntime.so.1 /opt/onnxruntime/lib/libonnxruntime.so
            fi
          fi
      - name: Data assets
        uses: actions/cache@v6
        with:
          path: .cache/assets
          key: assets-lexicon-lm-${{ hashFiles('resources/assets.json') }}
      - run: tools/zt setup
      - run: tools/zt data fetch engine
      - name: Cargo build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            engine/target
          key: engine-linux-${{ hashFiles('engine/Cargo.lock', 'engine/rust-toolchain.toml') }}
          restore-keys: engine-linux-
      - run: tools/zt build cli
      - run: tools/zt check engine

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: rust-${{ hashFiles('engine/Cargo.lock', 'engine/rust-toolchain.toml') }}
          restore-keys: rust-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The ONNX Runtime backend is linted without linking it (no ONNX Runtime on the runner).
      - run: cargo clippy --workspace --all-targets --locked --features zhuyin-cli/onnx -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - run: cargo test --workspace --locked
      - name: Licences and advisories
        run: |
          cargo install --locked cargo-deny
          cargo deny check
