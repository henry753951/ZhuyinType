[package]
name = "zhuyintype"
description = "ZhuyinType for Linux and Windows: settings, candidate window, setup wizard and the input method host"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "zhuyintype"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
zt-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true

# Window behaviour GPUI lacks on Windows (src/platform/windows.rs).
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Windows resources (icon, version, manifest); nothing for other targets.
[build-dependencies]
embed-resource = "3"

[lints]
workspace = true
