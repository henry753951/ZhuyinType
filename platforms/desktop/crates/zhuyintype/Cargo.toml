[package]
name = "zhuyintype"
description = "ZhuyinType for Linux and Windows: settings, candidate window, setup wizard and the input method host"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "zhuyintype"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
zt-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
async-channel.workspace = true
chrono.workspace = true
zhuyin-core.workspace = true
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Moving, showing and hiding the override-redirect candidate window on X11 (GPUI only resizes windows).
x11rb = { version = "0.13", features = ["shape"] }

[lints]
workspace = true
