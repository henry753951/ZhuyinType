# ZhuyinType for Linux and Windows: the GPUI app (settings, candidate window, setup wizard, input method host),
# its UI-free core, and the Windows TSF text service.  Built on the GPU host, never on the Mac
# (scripts/build.sh; `tools/zt --remote build desktop`).
[workspace]
resolver = "3"
members = ["crates/zt-panel", "crates/zt-core", "crates/zhuyintype", "crates/zt-tsf", "tools/gpui-shaders"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
version = "0.5.3"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.98"

[workspace.dependencies]
zhuyin-core = { path = "../../engine/crates/zhuyin-core" }
zt-core = { path = "crates/zt-core" }
zt-panel = { path = "crates/zt-panel" }
gpui-kit = { version = "=0.9.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
dirs = "6"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
rustix = { version = "1", features = ["net", "process", "fs", "param"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
] }

# GPUI's Windows backend compiles its shaders only on a Windows build host; the vendored copy also takes them
# precompiled, so Windows release builds cross-compile on Linux (vendor/gpui-pre-windows/build.rs).
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3

# Fast debug builds for the UI loop; dependencies optimised so GPUI stays smooth.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3
