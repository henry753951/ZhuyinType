[workspace]
resolver = "3"
members = ["crates/zhuyin-core", "crates/zhuyin-models", "crates/zhuyin-cli", "crates/zhuyin-ffi"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.88"

[workspace.dependencies]
memmap2 = "0.9"
serde_json = { version = "1", features = ["float_roundtrip"] }
# The system ONNX Runtime (1.24, C API 24); never the crate's downloaded binaries.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24"] }
libc = "0.2"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
# Unsafe code is allowed only in zhuyin-core's `binary` module (memory mapping), with a SAFETY comment per block.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Types are named after their Swift counterparts (`KeyChannel` → `key_channel::...`); repeating the module in a
# name is how the port stays searchable against the Swift engine.
module_name_repetitions = "allow"
# The Swift algorithms convert between Int/UInt32/Double the same way (counts to Double for averages, key indices
# to key-centre coordinates); the values are small, and matching Swift's arithmetic matters more than the lint.
cast_precision_loss = "allow"
# Binary formats store u32 counts and offsets: widening to usize and narrowing IDs back to u32 is the format.
cast_possible_truncation = "allow"
# Exact float comparisons are deliberate: results must be bit-identical to the Swift engine's.
float_cmp = "allow"
# Every unsafe block states why it is sound.
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
# The C ABI (phase 4) never unwinds across the boundary: a panic aborts the input method process.
panic = "abort"

[profile.bench]
lto = "fat"
codegen-units = 1
