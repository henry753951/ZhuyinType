# include/zhuyin.h is generated from the Rust sources and checked in:
#   cbindgen --config crates/zhuyin-ffi/cbindgen.toml --crate zhuyin-ffi --output crates/zhuyin-ffi/include/zhuyin.h
# (from engine/).  tests/header.rs fails when the checked-in header differs from a fresh run.
language = "C"
include_guard = "ZHUYIN_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "type"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
header = """/*
 * The C ABI of the ZhuyinType engine (engine/crates/zhuyin-ffi).  Generated by cbindgen; do not edit.
 *
 * Ownership
 *   - Strings passed in are UTF-8, NUL-terminated and borrowed for the call.  Strings returned (char *) belong to
 *     the caller and are freed with zt_string_free; lists and presentations with their own _free functions.
 *   - Handles are created by zt_*_new / zt_*_open / zt_reranker_configured and freed by the matching zt_*_free.
 *     A composer keeps its engine alive, so the engine handle may be freed first.
 *   - Hooks and models carry a context pointer and an optional release function, called exactly once when the hook
 *     is replaced or its owner is freed (or, for a model, when creating its scorer fails).
 *
 * Threading
 *   - An engine may be used from any thread, also concurrently.  A composer is used by one thread at a time (it may
 *     move between threads).  Rerankers and syllable scorers may be shared between threads; their model calls are
 *     serialized, and a model's context may be called from any thread that uses its scorer.
 *   - Callbacks run synchronously on the thread that called into the library and must not call back into the
 *     composer that invoked them.  Views passed to callbacks (ZtSentences, ZtStrings, ZtCandidateRows) are valid
 *     only until the callback returns.
 *
 * Errors
 *   Functions that can fail return NULL, false or -1 and, when `error` is not NULL, store a message there (free it
 *   with zt_string_free).
 */"""

[export]
prefix = ""
item_types = ["functions", "structs", "opaque", "constants", "typedefs"]

[parse]
parse_deps = false
