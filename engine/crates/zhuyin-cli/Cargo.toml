[package]
name = "zhuyin-cli"
description = "Type keys into the ZhuyinType composer from a terminal; every evaluation runs through it (port of engine/swift/Sources/zhuyin-cli)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

build = "build.rs"

[features]
# The neural models with ONNX Runtime (Linux, Windows); see README.md for linking the system library.
onnx = ["zhuyin-models/onnx"]

[[bin]]
name = "zhuyin-cli"
path = "src/main.rs"

[dependencies]
zhuyin-core = { path = "../zhuyin-core" }
zhuyin-models = { path = "../zhuyin-models" }
serde_json.workspace = true
libc.workspace = true

[lints]
workspace = true
