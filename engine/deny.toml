# cargo deny check: licenses compatible with distributing ZhuyinType under AGPL-3.0-only, no duplicate or yanked crates,
# crates only from crates.io.

[graph]
all-features = true

[advisories]
# Yanked crates are errors; security advisories are reported by default.
yanked = "deny"

[licenses]
# Permissive licenses only: everything linked into the input method can ship inside an AGPL-3.0-only app.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9
# The list is the policy, not an inventory: licenses no current dependency uses stay allowed silently.
unused-allowed-license = "allow"

[licenses.private]
# The workspace's own crates (publish = false).
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
